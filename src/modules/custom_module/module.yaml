module_name: custom_module

parameters:
    - group: Custom Safety
      definitions:

        SAFETY_ENG_DIST:
            description:
                short: LiDAR distance reading threshold in meters to engage safety mechanism
            type: float
            unit: m
            min: 0.0
            max: 1000.0
            default: 0.3

        SAFETY_RC_CH:
            description:
                short: RC Channel for Safety Mechanism Activation
            type: enum
            values:
                1: Channel 1
                2: Channel 2
                3: Channel 3
                4: Channel 4
                5: Channel 5
                6: Channel 6
                7: Channel 7
                8: Channel 8
                9: Channel 9
                10: Channel 10
                11: Channel 11
                12: Channel 12
                13: Channel 13
                14: Channel 14
                15: Channel 15
                16: Channel 16
                17: Channel 17
                18: Channel 18
            min: 1
            max: 18
            default: 8

        SAFETY_SOFT_EN:
            description:
                short: Enable Software based Safety Mechanism
                long: |
                    Warning: Only change it for debugging purposes.

                    Enables the following safeties:
                    - Checks if the vehicle is Armed.
                    - Checks if 35s have passed since arming.
                    - Checks if horizontal distance from home is more than 50m.
                    - Checks if altitude is more than 50m.
                    - Checks if vehicle is in RTH/RTL or Land mode.
                    - Checks if PWM to each rotor is above 10% of PWM range defined.
                    - Sets Home position to 50m away from arming position in the direction of flight.
            type: enum
            values:
                0: Disabled
                1: Enabled
            min: 0
            max: 1
            default: 1
